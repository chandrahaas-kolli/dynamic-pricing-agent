[project]
name = "dynamic-pricing-agent"
version = "0.1.0"
# capped to the only Python version CI tests; raising it is a deliberate PR
requires-python = ">=3.11,<3.12"
# exact versions live in uv.lock (installed with `uv sync --locked`);
# pyproject.toml holds minimum versions so Dependabot can upgrade coupled
# packages together
dependencies = [
    "awscrt>=0.38.0",
    "botocore>=1.43.117",
    "langchain-aws>=1.9.0",
    "langchain-core>=1.7.0",
    "langgraph>=1.2.16",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dateutil>=2.9.0.post0",
]

[dependency-groups]
dev = [
    "boto3>=1.43.117",
    "botocore-stubs>=1.43.117",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "types-python-dateutil>=2.9.0.20261021",
]

[tool.ruff.lint]
# E4/E7/E9/F are ruff's default error rules, I = import sorting, B = bugbear
# (common bug patterns), UP = modern Python 3.11 syntax. E501 (line too long)
# is deliberately off since the formatter wraps code lines.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

# basic mode (not strict); check_untyped_defs makes mypy check inside
# functions that have no type hints; warn_unused_ignores flags
# `# type: ignore` comments that are no longer needed.
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
# scratch files are gitignored experiments, not part of the codebase
exclude = ['^src/scratch_.*\.py$']

# run = measure only src/, count both outcomes of every if (branch
# coverage), skip gitignored scratch files
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/scratch_*.py"]

# report = list uncovered line numbers
[tool.coverage.report]
show_missing = true
# test run fails if total coverage drops below 98%
fail_under = 98
