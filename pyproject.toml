[project]
name = "dynamic-pricing-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "awscrt==0.36.0",
    "langchain-aws==1.7.9",
    "langchain-core==1.6.3",
    "langgraph==1.2.11",
    "pandas==3.0.5",
    "pydantic==2.13.5",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "botocore-stubs==1.43.115",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "types-python-dateutil==2.9.0.20260807",
]

[tool.ruff.lint]
# E4/E7/E9/F are ruff's default error rules, I = import sorting, B = bugbear
# (common bug patterns), UP = modern Python 3.11 syntax. E501 (line too long)
# is deliberately off since the formatter wraps code lines.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

# basic mode (not strict); check_untyped_defs makes mypy check inside
# functions that have no type hints; warn_unused_ignores flags
# `# type: ignore` comments that are no longer needed.
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
# scratch files are gitignored experiments, not part of the codebase
exclude = ['^src/scratch_.*\.py$']
