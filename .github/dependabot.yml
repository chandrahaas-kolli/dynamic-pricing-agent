version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      # weekly to limit noise
      interval: "weekly"
    cooldown:
      # delays brand-new releases 7 days as a supply-chain buffer
      # (security updates are not delayed)
      default-days: 7
    commit-message:
      # prefixes match Conventional Commits
      prefix: "build"
      include: "scope"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
        # majors ungrouped so a breaking upgrade is isolated and easy to revert

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # weekly to limit noise
      interval: "weekly"
    cooldown:
      # delays brand-new releases 7 days as a supply-chain buffer
      # (security updates are not delayed)
      default-days: 7
    commit-message:
      # prefixes match Conventional Commits
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
