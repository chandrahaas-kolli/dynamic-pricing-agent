name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # weekly schedule catches new CodeQL queries on unchanged code
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # job-level permissions replace (not add to) top-level ones
    permissions:
      contents: read
      # security-events: write is needed only to upload results
      security-events: write
      actions: read
    steps:
      - name: Download Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python, actions
      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
